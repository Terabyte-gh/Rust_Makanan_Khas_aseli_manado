[package]
name = "makanan_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres"] }
tera = { version = "2.4.0", features = ["glob_fs"] }
tokio = { version = "1.54.1", features = ["full"] }
